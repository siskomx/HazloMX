[package]
name = "hazlomexa"
default-run = "hazlomexa"
version = "0.1.0"
edition = "2021"
license = "MIT"

[features]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-dialog"]
custom-protocol = ["desktop", "tauri/custom-protocol"]

[[bin]]
name = "hazlomexa"
path = "src/main.rs"
required-features = ["desktop"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "=0.10.9"
zip = { version = "=9.0.2", default-features = false, features = ["deflate"] }
quick-xml = { version = "=0.42.0", features = ["serialize"] }
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "stream"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "io-util", "io-std", "sync"] }
rmcp = { version = "=3.5.1", default-features = false, features = ["client", "server", "transport-streamable-http-client-reqwest", "transport-child-process"] }
tauri = { version = "=2.12.3", optional = true , features = [] }
tauri-plugin-dialog = { version = "=2.8.2", optional = true }

[build-dependencies]
sha2 = "=0.10.9"
serde_json = "1"
tauri-build = { version = "=2.7.2", optional = true , features = [] }

[target.'cfg(windows)'.dependencies]
process-wrap = { version = "=10.0.1", default-features = false, features = ["tokio1", "job-object", "creation-flags", "kill-on-drop"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_Shell", "Wdk_Storage_FileSystem", "Wdk_Foundation", "Win32_System_IO", "Win32_System_WindowsProgramming"] }

[[bin]]
name = "hazlomexa-tools"
path = "src/tools_main.rs"
