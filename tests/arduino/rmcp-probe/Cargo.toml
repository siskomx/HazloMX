[package]
name = "hazlomexa-agent-sdk-probe"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
rmcp = { version = "=3.5.1", default-features = false, features = ["client", "transport-streamable-http-client-reqwest"] }
reqwest = { version = "=0.13.5", default-features = false }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
